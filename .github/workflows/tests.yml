name: Portal security and persistence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: portal_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: SQLite tests
        run: python -m unittest -v test_security.py test_storage.py test_resident_features.py
      - name: PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@localhost:5432/portal_test?sslmode=disable
        run: python -m unittest -v test_security.py test_storage.py test_resident_features.py
