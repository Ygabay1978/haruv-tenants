<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קבלות · ועד בניין חרוב</title><link rel="stylesheet" href="/style.css"><script src="/receipts.js" defer></script><main><h1>קבלות ועד הבית</h1><p>הפקה נשמרת עם מספר קבוע. ניתן לפתוח ולהוריד קבלה קיימת.</p><a href="/">חזרה לפורטל</a><p id="receipt-status" role="status"></p><section id="receipt-admin" hidden><form id="receipt-form"><div class="people"><label>מספר דירה<input id="receipt-apt" type="number" min="1" max="1000" required></label><label>שם המשלם<input id="receipt-payer" required maxlength="160"></label><label>שנת התשלום<input id="receipt-year" type="number" value="2026" required></label><label>חודשים, מופרדים בפסיק<input id="receipt-months" placeholder="7,8,9,10,11,12" required></label><label>סוג תשלום<select id="receipt-kind"><option value="dues">ועד בית</option><option value="ev">טעינת רכב חשמלי</option></select></label><label>סכום התקבול בש״ח<input id="receipt-amount" type="number" min="0.01" step="0.01" required></label><label>תאריך התשלום<input id="receipt-date" type="date" required></label><label>אמצעי תשלום<select id="receipt-method"><option>מזומן</option><option>העברה בנקאית</option><option>הוראת קבע</option><option>צ׳ק</option></select></label><label>אסמכתא<input id="receipt-reference" maxlength="100"></label></div><button type="submit">הפקת קבלה ושמירה</button></form><h2>קבלות שהופקו</h2><div id="receipt-list"></div></section></main></html>
