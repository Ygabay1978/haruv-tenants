<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חרוב · שתולים 57 תל אביב · תמונת מצב פיננסית</title><style>
*{box-sizing:border-box}body{margin:0;padding:26px;font-family:Arial,sans-serif;background:#fffdf9;color:#38281f}h1{font-size:25px;font-weight:500;margin:6px 0 9px}h2{font-size:17px;margin:0 0 22px}.subtitle{font-size:12px;color:#766b60;margin-bottom:25px}.currency{display:inline-grid;place-items:center;border:1px solid #ccb898;color:#866141;font-size:17px;padding:9px 12px;margin-bottom:10px;border-radius:4px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:28px}.kpi{padding:18px;border:1px solid #e7ded2;border-radius:5px;background:#f9f5ef}.kpi small{color:#756d62;font-size:11px;display:block;margin-top:8px}.kpi strong{display:block;font-size:23px;margin-top:10px}.income strong,.income-text{color:#237448}.expense strong,.expense-text{color:#ad382f}.neutral strong{color:#866141}.label{font-size:12px}.chart{padding:22px;border:1px solid #e7ded2;border-radius:6px;margin-bottom:24px}.legend{display:flex;gap:20px;font-size:12px;margin:10px 0 25px}.bars{height:190px;display:grid;grid-template-columns:repeat(12,1fr);gap:7px;direction:rtl}.month{display:flex;flex-direction:column;justify-content:end;gap:9px;min-width:0}.pair{height:155px;display:flex;align-items:end;justify-content:center;gap:3px}.bar{width:35%;min-height:1px;border-radius:3px 3px 0 0}.bar.income{background:#38835a}.bar.expense{background:#bb5145}.month small{font-size:10px;text-align:center;color:#766b60}.costs{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.cost{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee4d7;font-size:12px}.cost strong{color:#ad382f;font-weight:500;white-space:nowrap}footer{font-size:10px;color:#827364;margin-top:26px;line-height:1.8}@media(max-width:520px){body{padding:19px 14px}.kpi{padding:14px}.kpi strong{font-size:20px}.costs{grid-template-columns:1fr}.bars{gap:3px}.month small{font-size:8px}.chart{padding:17px 10px}h1{font-size:23px}}
</style></head><body><span class="currency">ש״ח</span><h1>תמונת מצב פיננסית</h1><div class="subtitle">בניין חרוב · שתולים 57 תל אביב · שנת 2026</div><div id="kpis" class="kpis"></div><section class="chart"><h2>הכנסות והוצאות לפי חודש</h2><div class="legend"><span class="income-text">● הכנסות</span><span class="expense-text">● הוצאות</span></div><div id="bars" class="bars"></div></section><section class="chart"><h2>הוצאות קבועות לפי ספק</h2><div class="costs" id="costs"></div></section><footer>סיכום לצפייה בלבד לדיירי הבניין. לפרטים ועדכונים פנו לוועד הבית.</footer><script id="embedded-summary" type="application/json">__SUMMARY__</script><script>
const data=JSON.parse(document.getElementById('embedded-summary').textContent);const money=n=>Number(n||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2})+' ש״ח';
function add(tag,value,parent,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.appendChild(e);return e}
for(const [label,key,type,sub] of [['הכנסה שנתית מלאה','annualIncome','income','לפי חיוב מלא לכל הדירות'],['הוצאות בפועל','totalExpenses','expense','מצטבר לתקופה'],['שולם עד כה','totalPaid','income','גבייה בפועל'],['הוצאות קבועות לחודש','fixedCostsTotal','expense','ספקים ושירותים'],['הכנסה חודשית מלאה','currentMonthlyIncome','income','לפי תעריפי הדירות'],['הוצאות משתנות','variableExpensesTotal','expense','מצטבר לתקופה'],['יתרה שנתית לגבייה','totalDue','neutral','עשויה לכלול חודשים עתידיים'],['אחוז הגבייה השנתי','collectionPct','income','מתוך החיוב השנתי']]){const c=add('div','',document.getElementById('kpis'),'kpi '+type);add('span',label,c,'label');add('strong',key==='collectionPct'?Math.round((data[key]||0)*100)+'%':money(data[key]),c);add('small',sub,c)}
const inc=data.monthlyIncome||[],exp=data.monthlyExpenses||[],max=Math.max(1,...inc,...exp);(data.months||[]).forEach((label,i)=>{const m=add('div','',document.getElementById('bars'),'month');const pair=add('div','',m,'pair');for(const [amount,type,title] of [[inc[i]||0,'income','הכנסות'],[exp[i]||0,'expense','הוצאות']]){const bar=add('div','',pair,'bar '+type);bar.style.height=(amount/max*100)+'%';bar.title=label+' · '+title+': '+money(amount)}add('small',label.slice(0,3),m)});
for(const r of data.fixedCosts||[]){const row=add('div','',document.getElementById('costs'),'cost');add('span',r.name,row);add('strong',money(r.amount),row)}
</script></body></html>
