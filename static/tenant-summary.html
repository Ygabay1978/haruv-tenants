<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'unsafe-inline' 'self'; style-src 'unsafe-inline' 'self'; connect-src 'none'; font-src 'self'; img-src 'self' data: blob:">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>בניין חרוב · שתולים 57 · תמונת מצב</title>


<style>
  :root{
    --bg:#0A1220; --bg-2:#0D1830; --surface:#131F35; --surface-2:#1B2B47; --surface-3:#22365a;
    --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.18);
    --text:#38281f; --text-soft:#766b60; --text-faint:#5E6C8A;
    --sky:#247547; --coral:#b2342b; --sun:#FFB238; --teal:#247547; --grape:#B98BFF; --rose:#FF5C93;
    --teal-glow:rgba(31,224,184,0.4); --coral-glow:rgba(255,107,74,0.45);
    --shadow: 0 4px 16px rgba(0,0,0,0.35), 0 20px 46px -18px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 600px at 88% -6%, rgba(63,169,245,0.16), transparent 60%),
      radial-gradient(700px 500px at 6% 8%, rgba(255,107,74,0.12), transparent 55%),
      var(--bg);
    color:var(--text); font-family:Arial,sans-serif; min-height:100vh;
  }
  .num{font-family:Arial,sans-serif; font-feature-settings:"tnum";}
  .shell{ max-width:900px; margin:0 auto; padding:20px 16px 50px; }

  .masthead{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding-bottom:16px; margin-bottom:18px; text-align:center; flex-direction:column; position:relative;
  }
  .masthead::after{
    content:''; position:absolute; left:10%; right:10%; bottom:0; height:3px; border-radius:3px;
    background: linear-gradient(90deg, var(--sky), var(--teal), var(--sun), var(--coral), var(--grape));
  }
  .masthead-row{ display:flex; align-items:center; gap:14px; }
  .building-mark{ width:56px;height:56px;flex:none; border-radius:50%; object-fit:cover; border:2px solid var(--border-strong); box-shadow:0 6px 18px rgba(0,0,0,0.5); }
  .masthead h1{
    font-family:'Frank Ruhl Libre',serif; font-weight:800; font-size:24px; margin:0;
    background: linear-gradient(92deg, #FFFFFF 10%, var(--sky) 55%, var(--teal) 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .masthead .subline{ font-size:12.5px; color:var(--text-soft); margin-top:5px; }
  .masthead .subline b{ color:var(--coral); font-weight:700; }
  .asof{ font-size:11px; color:var(--text-faint); margin-top:8px; }

  .panel{ border-radius:20px; background:var(--surface); border:1px solid var(--border); box-shadow: var(--shadow); padding:18px; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(4,1fr); grid-auto-flow:column; gap:12px; margin-bottom:20px; }
  .kpi{
    border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden;
    background: var(--surface-2); border:1px solid var(--border);
  }
  .kpi::before{ content:''; position:absolute; top:-40%; left:-10%; width:140px; height:140px; border-radius:50%; filter: blur(34px); opacity:0.35; pointer-events:none; }
  .kpi.c-teal::before{ background:var(--teal); } .kpi.c-teal .kpi-icon{ background:rgba(31,224,184,0.16); color:var(--teal); } .kpi.c-teal .kpi-value{ color:var(--teal); }
  .kpi.c-coral::before{ background:var(--coral); } .kpi.c-coral .kpi-icon{ background:rgba(255,107,74,0.16); color:var(--coral); } .kpi.c-coral .kpi-value{ color:var(--coral); }
  .kpi-icon{ width:28px;height:28px;border-radius:8px; display:flex;align-items:center;justify-content:center; margin-bottom:8px; position:relative; z-index:1; }
  .kpi-icon svg{ width:15px;height:15px; }
  .kpi-label{ font-size:10.5px; color:var(--text-soft); font-weight:600; position:relative; z-index:1; line-height:1.3; }
  .kpi-value{ font-family:Arial,sans-serif; font-weight:700; font-size:18px; position:relative; z-index:1; margin-top:2px; }
  .kpi-sub{ font-size:9.5px; color:var(--text-soft); margin-top:4px; position:relative; z-index:1;}

  .overview-grid{ display:grid; grid-template-columns: 170px 1fr; gap:16px; margin-bottom:20px; }
  .elevation-card{
    border-radius:14px; padding:14px 12px; background: linear-gradient(180deg, #0C1730, var(--surface-2));
    border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; position:relative; overflow:hidden;
  }
  .elevation-card h4{ margin:0 0 10px; font-size:10px; color:var(--text-soft); font-weight:700; text-align:center; }
  .roofline{ width:44px; height:0; border-left:22px solid transparent; border-right:22px solid transparent; border-bottom:13px solid var(--surface-3); margin-bottom:-1px; }
  .windows{ display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(5,1fr); gap:5px; width:100%; height:110px; background:var(--bg-2); padding:6px; border-radius:6px; border:1px solid var(--border); }
  .window{ border-radius:3px; background:rgba(255,255,255,0.045); }
  .elevation-pct{ margin-top:10px; font-family:Arial,sans-serif; font-weight:800; font-size:18px; }
  .pct-months{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; width:100%; }
  .pct-month-box{ border-radius:6px; padding:4px 2px 3px; text-align:center; }
  .pct-month-box .pmname{ display:block; font-size:7.5px; font-weight:600; color:#04182b; opacity:0.85; margin-bottom:1px; }
  .pct-month-box .pmval{ display:block; font-family:Arial,sans-serif; font-size:9.5px; font-weight:700; color:#04182b; }
  .elevation-caption{ font-size:9.5px; color:var(--text-soft); margin-top:2px; text-align:center; }

  .chart-card{ border-radius:14px; padding:14px 16px 10px; background:var(--surface-2); border:1px solid var(--border); }
  .chart-card h4{ margin:0 0 4px; font-size:12px; font-weight:700; color:var(--text); }
  .chart-legend{ display:flex; gap:12px; flex-wrap:wrap; margin:2px 0 4px; }
  .chart-legend-item{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-soft); font-weight:600; }
  .chart-legend-item .sw{ width:9px;height:9px;border-radius:3px; }
  .chart-wrap{ height:170px; position:relative; }
  .chart-tooltip{
    position:absolute; pointer-events:none; opacity:0; transition:opacity .1s ease;
    background:#050A14; color:#fff; font-size:11px; line-height:1.6; padding:7px 10px;
    border-radius:8px; white-space:nowrap; z-index:20; font-family:Arial,sans-serif;
    box-shadow:0 10px 26px rgba(0,0,0,0.55); border:1px solid var(--border-strong);
  }

  .two-col{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:16px; margin-bottom:6px; }
  .combined-fixed-card{ margin-bottom:6px; }
  .combined-fixed-grid{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:16px; align-items:center; }
  .chart-wrap.tall{ height:200px; }
  .fixed-legend{ display:flex; flex-direction:column; gap:6px; max-height:200px; overflow-y:auto; }
  .fixed-legend-row{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; padding:6px 9px; border-radius:8px; background:var(--surface-3); }
  .fixed-legend-row .lbl{ display:flex; align-items:center; gap:7px; color:var(--text); }
  .swatch{ width:9px;height:9px;border-radius:3px;flex:none; }
  .fixed-legend-row .amt{ font-family:Arial,sans-serif; color:var(--text-soft); font-weight:600; font-size:11px; }

  footer{ text-align:center; font-size:10.5px; color:var(--text-faint); margin-top:24px; line-height:1.7; }

  @media (max-width: 640px){
    .kpi-grid{ grid-template-columns:repeat(2,1fr); }
    .overview-grid{ grid-template-columns:1fr; }
    .two-col{ grid-template-columns:1fr; }
    .combined-fixed-grid{ grid-template-columns:1fr; }
    .masthead h1{ font-size:20px; }
    .panel{ padding:14px; border-radius:16px; }
  }
  @media (max-width: 380px){
    .kpi-grid{ grid-template-columns:1fr 1fr; gap:8px; }
    .kpi-value{ font-size:16px; }
  }
</style>
<style id="pro-refine">
:root{--bg:#0E1626;--bg-2:#0E1626;--surface:#121D33;--surface-2:#182540;--surface-3:#1F2F50;
--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.14);--text:#EAF0FA;--text-soft:#9AA7C2;--text-faint:#667391;
--sky:#5AA9E6;--teal:#247547;--sun:#E5B14C;--coral:#E97B60;--grape:#9D8FE3;--rose:#E4698E;
--sky-glow:transparent;--coral-glow:transparent;--sun-glow:transparent;--teal-glow:transparent;--grape-glow:transparent;--rose-glow:transparent;
--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);--shadow-lift:var(--shadow)}
body{background:var(--bg)!important}
*{text-shadow:none!important}
.masthead::after{opacity:.55}
</style>
<style id="residence-theme">
:root{--bg:#f6f1e9;--bg-2:#eee4d6;--surface:#fffdf9;--surface-2:#f4ecdf;--surface-3:#e4d4bf;--border:#e4d8c7;--border-strong:#cbb38e;--text:#38281f;--text-soft:#756452;--text-faint:#766b60;--sky:#247547;--teal:#247547;--coral:#b2342b;--sun:#a27936;--grape:#95734e;--shadow:0 4px 18px #38281f08}
body{background:var(--bg)!important;color:var(--text);font-family:Arial,sans-serif}
.masthead h1{background:none;color:var(--text);-webkit-text-fill-color:var(--text);font-family:Arial,sans-serif;font-weight:800}
.masthead::after{background:#bc9d6c;height:1px}.kpi-label,.chart-card h4,.elevation-card h4{font-weight:800;font-size:14px}.kpi-icon{font-weight:800}.kpi-label{color:var(--text)}.kpi.c-teal .kpi-icon{background:#24754716;color:#247547}.kpi.c-coral .kpi-icon{background:#b2342b13;color:#b2342b}.kpi::before{display:none}.kpi-sub{font-size:11px}.chart-tooltip{background:#fffdf9;color:#38281f;border:1px solid #d7c6ad}.kpi-grid{grid-template-rows:none;grid-auto-flow:row}.kpi-value{font-size:21px}.fixed-legend .amt{color:#b2342b}.building-mark{box-shadow:none}.elevation-card{background:#eee4d6!important}.chart-card{background:var(--surface-2)}
@media(max-width:600px){.shell{padding:18px 10px 30px}.overview-grid{grid-template-columns:1fr}.combined-fixed-grid{grid-template-columns:1fr}.chart-wrap{height:230px}.kpi-label{font-size:13px}.kpi-value{font-size:19px}.masthead h1{font-size:21px}.fixed-legend-row{font-size:12px}.chart-card h4{line-height:1.6}}
@media(max-width:350px){.kpi-grid{grid-template-columns:1fr}.kpi-value{font-size:22px}}
</style></head>
<body>
<div class="shell">

  <div class="masthead">
    <div class="masthead-row">
      <img class="building-mark" id="buildingPhoto" src="" alt="בניין שתולים 57" />
      <div>
        <h1>בניין חרוב · שתולים 57 תל אביב</h1>
        <div class="subline">תמונת מצב פיננסית — <b>שנת 2026</b></div>
      </div>
    </div>
    <div class="asof" id="asOfLine"></div>
  </div>

  <div class="panel">
    <div class="kpi-grid" id="kpiGrid"></div>

        <div class="overview-grid">
      <div class="elevation-card">
        <h4>אחוז גביה חודשי</h4>
        <div class="pct-months" id="floors"></div>
        <div class="elevation-pct" id="elevPct">–</div>
      </div>
      <div class="chart-card">
        <h4>הכנסות מול הוצאות חודשיות (ש״ח)</h4>
        <div class="chart-legend" id="monthlyLegend"></div>
        <div class="chart-wrap"><div id="monthlyChart" style="width:100%;height:100%"></div></div>
      </div>
    </div>

    <div class="chart-card combined-fixed-card">
      <h4>פילוח הוצאות קבועות לפי ספק</h4>
      <div class="combined-fixed-grid">
        <div class="chart-wrap tall"><div id="fixedDoughnut" style="width:100%;height:100%"></div></div>
        <div class="fixed-legend" id="fixedLegend"></div>
      </div>
    </div>
  </div>

  <footer>
    תמונת מצב זו היא סיכום קריאה בלבד לדיירי הבניין, נכון לתאריך שהופק.<br>
    לפרטים נוספים או שאלות — פנו לוועד הבית.
  </footer>
</div>

<script id="embedded-summary" type="application/json">__SUMMARY__</script>


<script>
(function(){
  "use strict";
  const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const PALETTE = ['#247547','#b2342b','#FFB238','#247547','#B98BFF','#FF5C93','#5FE07A','#FFCB47','#7C9BFF','#FF7A7A','#39C7C7','#E0A94E'];

  const s = JSON.parse(document.getElementById('embedded-summary').textContent);
  document.getElementById('buildingPhoto').src = '/building-photo';
  document.getElementById('asOfLine').textContent = 'הופק בתאריך: ' + new Date().toLocaleDateString('he-IL');

  function fmtILS(n){
    if(n === null || n === undefined || isNaN(n)) return '–';
    const neg = n < 0;
    const v = Math.abs(n).toLocaleString('he-IL', {maximumFractionDigits:0});
    return (neg ? '-' : '') + '₪' + v;
  }
  function fmtPct(p){ return (p*100).toFixed(0) + '%'; }
  function round2(n){ return n===null||n===undefined ? 0 : Math.round(n*100)/100; }

  const ICONS = {
    income: '<span style="font-size:12px;font-weight:700">ש״ח</span>',
    paid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
    due: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
    expense: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>',
    fixed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1"></rect><path d="M8 9V6a4 4 0 0 1 8 0v3"></path></svg>',
    balance: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M18.7 8l-5.3 5.3-4-4L3 15.6"></path></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>',
    variable: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>'
  };

  // ---- SVG chart helpers ----
  const SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs){ const el = document.createElementNS(SVGNS, tag); for(const k in attrs) el.setAttribute(k, attrs[k]); return el; }
  function ensureTooltip(container){
    let tt = container.querySelector(':scope > .chart-tooltip');
    if(!tt){ tt = document.createElement('div'); tt.className = 'chart-tooltip'; container.appendChild(tt); }
    return tt;
  }
  function bindTooltip(el, container, tt, htmlFn){
    el.style.cursor = 'pointer';
    el.addEventListener('mousemove', (e)=>{
      const rect = container.getBoundingClientRect();
      tt.innerHTML = htmlFn();
      tt.style.opacity = '1';
      let x = e.clientX - rect.left + 14, y = e.clientY - rect.top + 14;
      const ttW = 170, ttH = 60;
      if(x + ttW > rect.width) x = e.clientX - rect.left - ttW - 10;
      if(y + ttH > rect.height) y = e.clientY - rect.top - ttH - 6;
      tt.style.left = Math.max(2,x) + 'px'; tt.style.top = Math.max(2,y) + 'px';
    });
    el.addEventListener('mouseleave', ()=>{ tt.style.opacity = '0'; });
  }
  function polar(cx,cy,r,deg){ const rad = deg*Math.PI/180; return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) }; }
  function arcPath(cx,cy,r,rInner,startDeg,endDeg){
    const st = polar(cx,cy,r,startDeg), e = polar(cx,cy,r,endDeg);
    const si = polar(cx,cy,rInner,startDeg), ei = polar(cx,cy,rInner,endDeg);
    const largeArc = (endDeg-startDeg) > 180 ? 1 : 0;
    return `M ${st.x} ${st.y} A ${r} ${r} 0 ${largeArc} 1 ${e.x} ${e.y} L ${ei.x} ${ei.y} A ${rInner} ${rInner} 0 ${largeArc} 0 ${si.x} ${si.y} Z`;
  }

  function drawMonthlyChart(containerId, labels, income, expenses){
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const W=640, H=170, padL=38, padR=8, padT=8, padB=20;
    const plotW = W-padL-padR, plotH = H-padT-padB;
    const allVals = [...income, ...expenses, 0];
    const yMax = Math.max(...allVals) * 1.15 || 1;
    const yMin = Math.min(...allVals, 0) * 1.15;
    const range = (yMax - yMin) || 1;
    const yOf = v => padT + (yMax - v)/range*plotH;
    const zeroY = yOf(0);
    const svg = svgEl('svg', { viewBox:`0 0 ${W} ${H}`, width:'100%', height:'100%', style:'overflow:visible; display:block;' });
    for(let i=0;i<=3;i++){
      const gy = padT + plotH*i/3;
      svg.appendChild(svgEl('line', { x1:padL, x2:W-padR, y1:gy, y2:gy, stroke:'rgba(56,40,31,0.12)' }));
    }
    if(zeroY > padT && zeroY < padT+plotH){
      svg.appendChild(svgEl('line', { x1:padL, x2:W-padR, y1:zeroY, y2:zeroY, stroke:'rgba(56,40,31,0.22)' }));
    }
    const n = labels.length, groupW = plotW/n, barW = groupW*0.3;
    const tt = ensureTooltip(container);
    labels.forEach((lab,i)=>{
      const gx = padL + groupW*i;
      const incY = yOf(income[i]), incH = Math.abs(zeroY-incY) || 0.001;
      const incBar = svgEl('rect',{ x:gx+groupW*0.12, y:Math.min(incY,zeroY), width:barW, height:incH, rx:3, fill:'#247547' });
      svg.appendChild(incBar);
      bindTooltip(incBar, container, tt, ()=> `<b>${lab}</b><br>הכנסות: <b>${fmtILS(income[i])}</b>`);
      const expY = yOf(expenses[i]), expH = Math.abs(zeroY-expY) || 0.001;
      const expBar = svgEl('rect',{ x:gx+groupW*0.12+barW+3, y:Math.min(expY,zeroY), width:barW, height:expH, rx:3, fill:'#b2342b' });
      svg.appendChild(expBar);
      bindTooltip(expBar, container, tt, ()=> `<b>${lab}</b><br>הוצאות: <b>${fmtILS(expenses[i])}</b>`);
      const t = svgEl('text',{ x:gx+groupW/2, y:H-6, 'text-anchor':'middle', 'font-size':'8.5', 'font-family':'Rubik', fill:'#766b60' });
      t.textContent = lab.slice(0,3);
      svg.appendChild(t);
    });
    container.appendChild(svg);
  }

  function drawDoughnut(containerId, items, totalAmount){
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    if(!items.length){ container.innerHTML = '<div style="text-align:center;color:var(--text-soft);font-size:11px;padding:20px 0;">אין נתונים</div>'; return; }
    const size=220, cx=size/2, cy=size/2, r=88, rInner=54;
    const total = items.reduce((a,b)=>a+b.amount,0) || 1;
    let angle = -90;
    const svg = svgEl('svg', { viewBox:`0 0 ${size} ${size}`, width:'100%', height:'100%', style:'overflow:visible; display:block;' });
    const tt = ensureTooltip(container);
    items.forEach((it,i)=>{
      const frac = it.amount/total;
      const start = angle, end = angle + Math.max(frac*360, 0.6);
      angle = start + frac*360;
      const p = svgEl('path', { d: arcPath(cx,cy,r,rInner,start,end), fill: PALETTE[i%PALETTE.length], stroke:'#fff', 'stroke-width':2 });
      p.addEventListener('mouseenter', ()=> p.style.opacity = '0.78');
      p.addEventListener('mouseleave', ()=> p.style.opacity = '1');
      bindTooltip(p, container, tt, ()=> `<b>${it.name}</b><br>${fmtILS(it.amount)} (${(frac*100).toFixed(0)}%)`);
      svg.appendChild(p);
    });
    const t1 = svgEl('text', { x:cx, y:cy-3, 'text-anchor':'middle', 'font-size':'15', 'font-weight':'700', 'font-family':'Roboto Mono', fill:'#38281f' });
    t1.textContent = fmtILS(totalAmount);
    const t2 = svgEl('text', { x:cx, y:cy+15, 'text-anchor':'middle', 'font-size':'9.5', 'font-family':'Rubik', fill:'#766b60' });
    t2.textContent = 'סה"כ חודשי';
    svg.appendChild(t1); svg.appendChild(t2);
    container.appendChild(svg);
  }

  // ---- render KPIs (income=green, expense=red, balance conditional) ----
  const cards = [
    {c:'teal', icon:ICONS.income, label:'הכנסה שנתית מלאה', value: fmtILS(s.annualIncome), sub:'לפי חיוב מלא לכל הדירות'},
    {c:'coral', icon:ICONS.expense, label:'הוצאות בפועל', value: fmtILS(s.totalExpenses), sub:'מצטבר לתקופה הנוכחית'},
    {c:'teal', icon:ICONS.paid, label:'סה"כ שולם עד כה', value: fmtILS(s.totalPaid), sub: fmtPct(s.collectionPct) + ' מהחיוב השנתי'},
    {c:'coral', icon:ICONS.due, label:'יתרה לגביה', value: fmtILS(s.totalDue), sub:'טרם נגבה מהדיירים'},
    {c:'coral', icon:ICONS.fixed, label:'הוצאות קבועות / חודש', value: fmtILS(s.fixedCostsTotal), sub: s.fixedCosts.length + ' ספקים קבועים'},
    {c:'teal', icon:ICONS.calendar, label:'הכנסה חודשית', value: fmtILS(s.currentMonthlyIncome), sub:'הכנסה חודשית מלאה נוכחית'},
    {c:'coral', icon:ICONS.variable, label:'הוצאות משתנות', value: fmtILS(s.variableExpensesTotal), sub:'סה"כ מצטבר'},
  ];
  const orderedCards = cards.filter(c=>c.c==='teal').concat(cards.filter(c=>c.c==='coral'));
  document.getElementById('kpiGrid').innerHTML = orderedCards.map(c => `
    <div class="kpi c-${c.c}">
      <div class="kpi-icon">${c.icon}</div>
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}</div>
      <div class="kpi-sub">${c.sub}</div>
    </div>`).join('');

  // ---- elevation (per-month collection %) ----
  const floors = document.getElementById('floors');
  const monthPctColor = (p) => p >= 0.80 ? '#247547' : (p >= 0.50 ? '#FFB238' : '#b2342b');
  let floorsHtml = '';
  for(let i=0;i<Math.min(12,s.months.length);i++){
    const pct = s.currentMonthlyIncome > 0 ? (s.monthlyIncome[i] / s.currentMonthlyIncome) : 0;
    const bg = monthPctColor(pct);
    floorsHtml += `<div class="pct-month-box" style="background:${bg}"><span class="pmname">${s.months[i].slice(0,3)}</span><span class="pmval">${Math.round(pct*100)}%</span></div>`;
  }
  floors.innerHTML = floorsHtml;
  const elevPct = document.getElementById('elevPct');
  elevPct.textContent = fmtPct(s.collectionPct);
  elevPct.style.color = s.collectionPct >= 0.55 ? '#247547' : (s.collectionPct >= 0.4 ? '#FFB238' : '#b2342b');

  // ---- monthly chart ----
  document.getElementById('monthlyLegend').innerHTML = `
    <div class="chart-legend-item"><span class="sw" style="background:#247547"></span>הכנסות</div>
    <div class="chart-legend-item"><span class="sw" style="background:#b2342b"></span>הוצאות</div>
  `;
  drawMonthlyChart('monthlyChart', s.months, s.monthlyIncome, s.monthlyExpenses);

  // ---- fixed costs doughnut + legend ----
  drawDoughnut('fixedDoughnut', s.fixedCosts, s.fixedCostsTotal);
  document.getElementById('fixedLegend').innerHTML = s.fixedCosts.map((f,i)=>`
    <div class="fixed-legend-row">
      <span class="lbl"><span class="swatch" style="background:${PALETTE[i%PALETTE.length]}"></span>${f.name}</span>
      <span class="amt">${fmtILS(f.amount)}</span>
    </div>`).join('');
})();
</script>
</body>
</html>
