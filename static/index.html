<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>בניין חרוב · פורטל הדיירים</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><div class="brand">חרוב<span>שתולים 57</span></div><span>המרחב האישי לדיירים</span></header><main><section id="login"><span class="eyebrow">טוב לראות אתכם</span><h1>כל המידע על הדירה שלכם,<br>במקום אחד.</h1><p>כניסה מאובטחת לבעלי דירות ולשוכרים באמצעות קוד SMS.</p><form id="phone-form"><label for="phone">מספר הטלפון שלכם</label><input id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="050-0000000" required><button>שלחו לי קוד כניסה</button></form><form id="code-form" hidden><label for="code">קוד הכניסה שקיבלתם</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,10}" required><button>כניסה לפורטל</button><button type="button" id="back" class="secondary">שינוי מספר / שליחה מחדש</button></form><small>הכניסה מיועדת למספרים הרשומים אצל ועד הבית.</small></section><section id="portal" hidden><div class="toolbar"><h1>הדירות שלי</h1><button class="secondary" id="logout">יציאה</button></div><div id="apartments"></div><h2>תמונת המצב של הבניין</h2><iframe id="summary" title="הסיכום הכללי לדיירים" sandbox="allow-scripts"></iframe></section><p id="message" role="status" aria-live="polite"></p></main><footer>בניין חרוב · צפייה בלבד · לשאלות ולעדכון פרטי גישה פנו לוועד הבית</footer></body></html>
